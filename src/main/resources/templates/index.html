<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <h1 class="mb-4">Employee Management System</h1>

    <div class="card mb-4">
        <div class="card-body">
            <h5>Add Employee</h5>
            <form action="/employees" method="post" class="row g-3">
                <div class="col-md-4">
                    <input name="name" class="form-control" placeholder="Name" required>
                </div>
                <div class="col-md-4">
                    <input name="email" type="email" class="form-control" placeholder="Email" required>
                </div>
                <div class="col-md-4">
                    <input name="department" class="form-control" placeholder="Department">
                </div>
                <div class="col-12">
                    <button class="btn btn-primary">Add Employee</button>
                </div>
            </form>
        </div>
    </div>

    <form action="/employees/search" method="get" class="input-group mb-4">
        <input name="name" class="form-control" placeholder="Search by name">
        <button class="btn btn-outline-secondary">Search</button>
        <a href="/" class="btn btn-outline-dark">Reset</a>
    </form>

    <div class="card">
        <div class="card-body">
            <h5>Employees</h5>
            <table class="table table-striped mt-3">
                <thead>
                <tr><th>ID</th><th>Name</th><th>Email</th><th>Department</th><th>Action</th></tr>
                </thead>
                <tbody>
                <tr th:each="employee : ${employees}">
                    <td th:text="${employee.id}"></td>
                    <td th:text="${employee.name}"></td>
                    <td th:text="${employee.email}"></td>
                    <td th:text="${employee.department}"></td>
                    <td>
                        <a th:href="@{/employees/delete/{id}(id=${employee.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Delete this employee?')">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
